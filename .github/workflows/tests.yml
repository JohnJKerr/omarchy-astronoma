name: Tests

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # Deliberately neither UTC nor the author's zone. Record ids are local
      # time, so a test that reads the clock without going through TempEnv's
      # pin passes in London and fails here — which is the failure this job
      # exists to catch before a contributor hits it.
      TZ: Asia/Tokyo
    strategy:
      # Report every version's result, rather than hiding the rest behind
      # whichever failed first.
      fail-fast: false
      matrix:
        # Arch ships 3.14, so that is what an Omarchy machine actually runs
        # the helper under. 3.12 and 3.13 are kept as the trailing edge for
        # anyone on an older Arch, and because they catch accidental use of
        # very new syntax. The floor is 3.10 regardless: the helper annotates
        # with `str | None` and has no `from __future__ import annotations`,
        # so those are evaluated at import time.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # No dependencies to install: the helper is standard library only,
        # and the suite stubs out the network, pacman and the Omarchy CLI, so
        # it needs nothing from the runner but bash and Python.
        run: python -m unittest discover -s tests -t . --verbose

      - name: Check the manifest is loadable and its entry points exist
        # `omarchy plugin validate` is not available here, so this covers the
        # part that can go wrong in a commit: an entry point renamed in the
        # manifest but not on disk, or vice versa.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path("manifest.json").read_text())
          missing = [
              f"{kind} -> {path}"
              for kind, path in manifest["entryPoints"].items()
              if not pathlib.Path(path).is_file()
          ]
          if missing:
              sys.exit("entry points missing from disk: " + ", ".join(missing))
          print("manifest ok:", manifest["id"], manifest["version"])
          PY

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          manifest = json.loads(pathlib.Path("manifest.json").read_text())
          version = manifest.get("version", "")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit(
                  f"manifest has invalid version {version!r}; expected MAJOR.MINOR.PATCH"
              )

          expected_tag = f"v{version}"
          if os.environ["TAG"] != expected_tag:
              raise SystemExit(
                  f"tag {os.environ['TAG']!r} does not match manifest version; "
                  f"expected {expected_tag!r}"
              )
          print(f"Tag and manifest agree: {expected_tag}")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
